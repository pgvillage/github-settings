# The repositories of pgvillage: profiles and exceptions to the standard (standard.yaml).
# Started as the exported current state (2026-11-09); moves to the standard in small PRs (#1).
profiles:
  ansible-role:
    ruleset:
      required_checks:
        - Ansible Lint
        - Molecule
      rules:
        deletion: {}
        non_fast_forward: {}
        pull_request:
          allowed_merge_methods:
            - merge
            - squash
            - rebase
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: true
          require_extra_approval_for_unattributed_changes: true
          require_last_push_approval: true
          required_approving_review_count: 1
          required_review_thread_resolution: true
  ansible-lint-only:
    ruleset:
      required_checks:
        - Ansible Lint
      rules:
        deletion: {}
        non_fast_forward: {}
        pull_request:
          allowed_merge_methods:
            - merge
            - squash
            - rebase
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: true
          require_extra_approval_for_unattributed_changes: true
          require_last_push_approval: true
          required_approving_review_count: 1
          required_review_thread_resolution: true
  pgv:
    ruleset:
      rules:
        deletion: {}
        non_fast_forward: {}
        pull_request:
          allowed_merge_methods:
            - merge
            - squash
            - rebase
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: true
          require_extra_approval_for_unattributed_changes: true
          require_last_push_approval: true
          required_approving_review_count: 1
          required_review_thread_resolution: true
orgs:
  pgvillage:
    repos:
      - match: ansible-role-linux
        ruleset:
          required_checks:
            - Ansible Lint
            - Molecule (apt)
            - Molecule (default)
            - Molecule (zypper)
          rules:
            deletion: {}
            non_fast_forward: {}
            pull_request:
              allowed_merge_methods:
                - merge
                - squash
                - rebase
              dismiss_stale_reviews_on_push: true
              require_code_owner_review: true
              require_extra_approval_for_unattributed_changes: true
              require_last_push_approval: true
              required_approving_review_count: 1
              required_review_thread_resolution: true
      - match: ansible-role-nagios
        profile: ansible-lint-only
      - match: github-settings
        ruleset:
          merge_queue:
            check_response_timeout_minutes: 60
            grouping_strategy: ALLGREEN
            max_entries_to_build: 5
            max_entries_to_merge: 5
            merge_method: SQUASH
            min_entries_to_merge: 1
            min_entries_to_merge_wait_minutes: 5
          required_checks:
            - CI result
            - Validate PR Title
          rules:
            deletion: {}
            non_fast_forward: {}
            pull_request:
              allowed_merge_methods:
                - squash
              dismiss_stale_reviews_on_push: true
              require_code_owner_review: true
              require_extra_approval_for_unattributed_changes: true
              require_last_push_approval: true
              required_approving_review_count: 1
              required_review_thread_resolution: true
        settings:
          allow_update_branch: true
      - match: pgvillage
        profile: ansible-lint-only
      - match: ansible-role-*
        profile: ansible-role
      - match: pgv_*
        profile: pgv
