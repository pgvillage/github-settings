# The repositories of pgvillage: profiles and exceptions to the standard (standard.yaml).
# Started as the exported current state (2026-11-09); moves to the standard in small PRs (#1).
profiles:
  ansible-role:
    ruleset:
      merge_queue:
        check_response_timeout_minutes: 60
        grouping_strategy: ALLGREEN
        max_entries_to_build: 5
        max_entries_to_merge: 5
        merge_method: SQUASH
        min_entries_to_merge: 1
        min_entries_to_merge_wait_minutes: 5
      required_checks:
        - CI result
        - Validate PR Title
    settings:
      allow_update_branch: true
  ansible-lint-only:
    ruleset:
      required_checks:
        - Ansible Lint
orgs:
  pgvillage:
    repos:
      # New, still being set up: review rules only until it has CI (Ansible Lint + Molecule + CI result)
      - match: ansible-role-pgadmin
      - match: github-settings
        ruleset:
          merge_queue:
            check_response_timeout_minutes: 60
            grouping_strategy: ALLGREEN
            max_entries_to_build: 5
            max_entries_to_merge: 5
            merge_method: SQUASH
            min_entries_to_merge: 1
            min_entries_to_merge_wait_minutes: 5
          required_checks:
            - CI result
            - Validate PR Title
        settings:
          allow_update_branch: true
      - match: pgvillage
        profile: ansible-lint-only
      - match: ansible-role-*
        profile: ansible-role
      - match: pgv_*
