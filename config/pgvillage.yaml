# The repositories of pgvillage: exceptions to the standard (standard.yaml). The first matching rule applies.
orgs:
  pgvillage:
    repos:
      # New, still being set up: review rules only until it has CI (Ansible Lint + Molecule + CI result)
      - match: ansible-role-pgadmin
        profile: review-only
      - match: pgv_*
        profile: review-only
      - match: "*"
