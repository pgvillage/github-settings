# The standard for every repository (#1). Org files and profiles override parts of it.
standard:
  settings:
    allow_auto_merge: true
    allow_merge_commit: false
    allow_rebase_merge: false
    allow_squash_merge: true
    allow_update_branch: true
    delete_branch_on_merge: true
  ruleset:
    rules:
      deletion: {}
      non_fast_forward: {}
      pull_request:
        allowed_merge_methods:
          - squash
        # require_extra_approval_for_unattributed_changes is left to GitHub's default: it only applies to pull requests
        # that Copilot opens under its own identity, and we don't use Copilot.
        dismiss_stale_reviews_on_push: true
        require_code_owner_review: true
        require_last_push_approval: true
        required_approving_review_count: 1
        required_review_thread_resolution: true
    merge_queue:
      check_response_timeout_minutes: 60
      grouping_strategy: ALLGREEN
      max_entries_to_build: 5
      max_entries_to_merge: 5
      merge_method: SQUASH
      min_entries_to_merge: 1
      min_entries_to_merge_wait_minutes: 5
    required_checks:
      - CI result
      - Validate PR Title
profiles:
  # For the repositories that are not (yet) on the standard: the review rules only, no required checks and no merge
  # queue.
  review-only:
    ruleset:
      merge_queue: null
      required_checks: null
    settings:
      allow_update_branch: false
