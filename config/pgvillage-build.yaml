# Current state of the repositories of pgvillage-build, exported with ghsettings export (2026-11-09).
# Planning this config changes nothing; changes towards the standard (#1) follow in separate PRs.
profiles:
  no-required-checks:
    settings:
      allow_auto_merge: true
      allow_merge_commit: true
      allow_rebase_merge: true
      allow_squash_merge: true
      allow_update_branch: false
      delete_branch_on_merge: true
    ruleset:
      rules:
        deletion: {}
        non_fast_forward: {}
        pull_request:
          allowed_merge_methods:
            - merge
            - squash
            - rebase
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: true
          require_extra_approval_for_unattributed_changes: true
          require_last_push_approval: true
          required_approving_review_count: 1
          required_review_thread_resolution: true
orgs:
  pgvillage-build:
    repos:
      - match: aptbuilder
        profile: no-required-checks
      - match: db2_fdw
        profile: no-required-checks
      - match: imgbuilder
        profile: no-required-checks
      - match: rpmbuilder
        settings:
          allow_auto_merge: true
          allow_merge_commit: true
          allow_rebase_merge: true
          allow_squash_merge: true
          allow_update_branch: false
          delete_branch_on_merge: true
        ruleset:
          required_checks:
            - Validate PR Title
            - check-build-rpms-status
          rules:
            deletion: {}
            non_fast_forward: {}
            pull_request:
              allowed_merge_methods:
                - merge
                - squash
                - rebase
              dismiss_stale_reviews_on_push: true
              require_code_owner_review: true
              require_extra_approval_for_unattributed_changes: true
              require_last_push_approval: true
              required_approving_review_count: 1
              required_review_thread_resolution: true
