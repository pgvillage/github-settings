# The repositories of pgvillage-tools: profiles and exceptions to the standard (standard.yaml).
# Started as the exported current state (2026-11-09); moves to the standard in small PRs (#1).
orgs:
  pgvillage-tools:
    repos:
      - match: chainsmith
        ruleset:
          required_checks:
            - Ensure Go modules synchronicity
            - Lint Go code
            - Run unittests
            - Validate PR Title
          rules:
            deletion: {}
            non_fast_forward: {}
            pull_request:
              allowed_merge_methods:
                - merge
                - squash
                - rebase
              dismiss_stale_reviews_on_push: false
              require_code_owner_review: false
              require_extra_approval_for_unattributed_changes: true
              require_last_push_approval: false
              required_approving_review_count: 1
              required_review_thread_resolution: false
      - match: dbtwool
        ruleset:
          required_checks:
            - Ensure Go modules synchronicity
            - Lint Go code
            - Run unit tests
            - Shellcheck
            - Validate PR Title
            - integration-test (db2)
            - integration-test (pg)
          rules:
            deletion: {}
            non_fast_forward: {}
            pull_request:
              allowed_merge_methods:
                - merge
                - squash
                - rebase
              dismiss_stale_reviews_on_push: false
              require_code_owner_review: false
              require_extra_approval_for_unattributed_changes: true
              require_last_push_approval: false
              required_approving_review_count: 0
              required_review_thread_resolution: false
      - match: ghsettings
        ruleset:
          merge_queue:
            check_response_timeout_minutes: 60
            grouping_strategy: ALLGREEN
            max_entries_to_build: 5
            max_entries_to_merge: 5
            merge_method: SQUASH
            min_entries_to_merge: 1
            min_entries_to_merge_wait_minutes: 5
          required_checks:
            - CI result
            - Validate PR Title
          rules:
            deletion: {}
            non_fast_forward: {}
            pull_request:
              allowed_merge_methods:
                - squash
              dismiss_stale_reviews_on_push: true
              require_code_owner_review: true
              require_extra_approval_for_unattributed_changes: true
              require_last_push_approval: true
              required_approving_review_count: 1
              required_review_thread_resolution: true
        settings:
          allow_update_branch: true
      - match: orion
        ruleset:
          merge_queue:
            check_response_timeout_minutes: 60
            grouping_strategy: ALLGREEN
            max_entries_to_build: 5
            max_entries_to_merge: 5
            merge_method: SQUASH
            min_entries_to_merge: 1
            min_entries_to_merge_wait_minutes: 5
          required_checks:
            - Ensure Go modules synchronicity
            - Lint Go code
            - Run unit tests
            - Shellcheck
            - check-e2e-status
          rules:
            deletion: {}
            non_fast_forward: {}
            pull_request:
              allowed_merge_methods:
                - merge
                - squash
                - rebase
              dismiss_stale_reviews_on_push: false
              require_code_owner_review: true
              require_extra_approval_for_unattributed_changes: true
              require_last_push_approval: true
              required_approving_review_count: 1
              required_review_thread_resolution: true
      - match: pg_tps_optimizer
        ruleset:
          required_checks:
            - Build docker image (linux/amd64)
            - Build docker image (linux/arm64)
            - Build documentation
            - Run e2e tests (testcontainers)
            - Run unit tests
            - Rustfmt and Clippy
            - Security audit (cargo audit)
            - Validate PR Title
          rules:
            deletion: {}
            non_fast_forward: {}
            pull_request:
              allowed_merge_methods:
                - merge
                - squash
                - rebase
              dismiss_stale_reviews_on_push: true
              require_code_owner_review: false
              require_extra_approval_for_unattributed_changes: true
              require_last_push_approval: true
              required_approving_review_count: 1
              required_review_thread_resolution: false
      - match: pgarrow
      - match: pgav
      - match: pgcustodian
      - match: pgfga
        ruleset:
          required_checks:
            - Ensure Go modules synchronicity
            - Lint Go code
            - Run integration tests
            - Run unittests
            - Validate PR Title
          rules:
            deletion: {}
            non_fast_forward: {}
            pull_request:
              allowed_merge_methods:
                - merge
                - squash
                - rebase
              dismiss_stale_reviews_on_push: false
              require_code_owner_review: false
              require_extra_approval_for_unattributed_changes: true
              require_last_push_approval: false
              required_approving_review_count: 1
              required_review_thread_resolution: false
      - match: pghba
      - match: pgquartz
      - match: pgroute66
        ruleset:
          required_checks:
            - Ensure Go modules synchronicity
            - Lint Go code
            - Run unit tests
            - Shellcheck
            - integration-test
          rules:
            deletion: {}
            non_fast_forward: {}
      - match: pgsectest
      - match: pgtester
        ruleset:
          required_checks:
            - Ensure Go modules synchronicity
            - Lint Go code
            - Run integration tests (13)
            - Run integration tests (14)
            - Run integration tests (15)
            - Run integration tests (16)
            - Run integration tests (17)
            - Run unittests
            - Validate PR Title
          rules:
            deletion: {}
            non_fast_forward: {}
            pull_request:
              allowed_merge_methods:
                - merge
                - squash
                - rebase
              dismiss_stale_reviews_on_push: false
              require_code_owner_review: false
              require_extra_approval_for_unattributed_changes: true
              require_last_push_approval: false
              required_approving_review_count: 0
              required_review_thread_resolution: false
      - match: specbuilder
        ruleset:
          required_checks:
            - Ensure Go modules synchronicity
            - Lint Go code
            - Run unit tests
            - Shellcheck
            - Validate PR Title
            - check-e2e-status
          rules:
            deletion: {}
            non_fast_forward: {}
            pull_request:
              allowed_merge_methods:
                - merge
                - squash
                - rebase
              dismiss_stale_reviews_on_push: true
              require_code_owner_review: true
              require_extra_approval_for_unattributed_changes: false
              require_last_push_approval: false
              required_approving_review_count: 1
              required_review_thread_resolution: true
      - match: stolon
        ruleset:
          required_checks:
            - Ensure Go modules synchronicity
            - Lint Go code
            - Run e2e tests (14)
            - Run e2e tests (15)
            - Run e2e tests (16)
            - Run e2e tests (17)
            - Run e2e tests (18)
            - Run unit tests
            - Shellcheck
          rules:
            deletion: {}
            non_fast_forward: {}
            pull_request:
              allowed_merge_methods:
                - merge
                - squash
                - rebase
              dismiss_stale_reviews_on_push: false
              require_code_owner_review: false
              require_extra_approval_for_unattributed_changes: true
              require_last_push_approval: true
              required_approving_review_count: 0
              required_review_thread_resolution: false
      - match: wal-g
