# The repositories of pgvillage-tools: exceptions to the standard (standard.yaml). The first matching rule applies.
orgs:
  pgvillage-tools:
    repos:
      # Review rules only for now; CI and required checks to be revisited: pgvillage/pgvillage#149
      - match: pgarrow
        profile: review-only
      - match: pghba
        profile: review-only
      - match: pgsectest
        profile: review-only
      # Exception: wal-g is a copy of upstream wal-g that merges upstream commits, so it keeps upstream's CI and
      # CODEOWNERS (no required checks, no merge queue). To be phased out once our changes are upstream (#1).
      - match: wal-g
        profile: review-only
      # No CI yet: review rules only until they are on the standard (pgdemo#1, pgtestbuilder#1)
      - match: pgdemo
        profile: review-only
      - match: pgtestbuilder
        profile: review-only
      - match: "*"
